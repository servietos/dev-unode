manifestVersion: 1
id: dev-unode-owncast
name: Owncast
tagline: A free and open source live video and web chat server
icon: https://raw.githubusercontent.com/servietos/dev-unode/master/gallery/owncast-icon.svg
category: social
version: "0.2.1-1"
port: 8055
description: >-
    Owncast is an innovative open-source platform designed for self-hosted live streaming and video hosting. With Owncast, users can broadcast their live streams directly from their own servers, offering a decentralized alternative to popular streaming services. This empowers creators to maintain control over their content, audience interactions, and monetization strategies without the constraints of corporate platforms.


    Key features of Owncast include:
    

    📺 Live Streaming: Stream live events, gaming sessions, or creative broadcasts with ease, allowing for real-time engagement with viewers.

    
    📹 Video Hosting: Upload and host video content, creating a personalized library of media that can be shared with followers.
    
    
    🎨 Customizable Interface: Tailor the look and feel of your streaming platform to match your branding and preferences.
    
    
    👥 Community Engagement: Foster a direct connection with your audience through chat functionalities, polls, and notifications.
    

    Whether you’re a gamer, artist, educator, or content creator, Owncast provides the tools to build your unique streaming experience. Embrace the freedom of self-hosting and engage your audience like never before!


    ⚠️ Der Admin-Bereich erreichbar unter `umbrel.local:8055/admin` ist durch den Umbrel-Login geschützt, die Zuschauerseite bleibt frei. Der Standard-Zugang der Owncast-Weboberfläche ist admin / abc123: Ändere das Passwort nach dem ersten Start in den Owncast-Einstellungen, ebenso den Stream-Key.

developer: Gabe Kangas
website: https://owncast.online
submitter: servietos
submission: https://github.com/servietos/dev-unode
repo: https://github.com/owncast
support: https://github.com/owncast/owncast/issues
gallery:
