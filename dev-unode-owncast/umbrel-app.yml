  - https://i.imgur.com/zIeK5Yc.png
  - https://i.imgur.com/NyhKo1Y.png
releaseNotes: >-
  Admin-Bereich (/admin, /api/admin) ist jetzt durch den Umbrel-Login geschützt, die Zuschauerseite bleibt öffentlich. Beschreibung, Port und Icon korrigiert.
dependencies: []
