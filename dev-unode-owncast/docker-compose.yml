version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-owncast_owncast_1
      APP_PORT: 8080
      # Zuschauerseite ohne Umbrel-Login; der Admin-Bereich /admin hat ein eigenes Passwort
      PROXY_AUTH_ADD: "false"

  owncast:
    image: owncast/owncast:0.2.1@sha256:0df31c934eade2ca9275db374318a32088e1a060bdb3853716d6343a5d5c8d42
    restart: on-failure
    ports:
      - "1935:1935"   # RTMP-Eingang für OBS & Co.
    volumes:
      - ${APP_DATA_DIR}/data/owncast:/app/data
