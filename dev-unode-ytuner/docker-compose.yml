version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-ytuner_server_1
      APP_PORT: 80
    container_name: dev-unode-ytuner_app_proxy_1

  server:
    image: gpopesc/ytuner:latest
    container_name: dev-unode-ytuner_server_1
    restart: unless-stopped
    ports:
      - "8095:80"
      - "8053:53/udp"
      - "8053:53/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/app/host-shared
