manifestVersion: 1
id: dev-unode-ytuner
name: YTuner
tagline: Internet-Radio für vTuner-AVRs (Yamaha, Denon, Marantz u. a.)
category: media
version: "1.2.6"
port: 8095
description: |-
  YTuner ersetzt den eingestellten vTuner-Internetradio-Dienst für AVRs
  von Yamaha, Denon, Onkyo, Marantz, Pioneer, Harman Kardon u. a.
  Bietet eigene Stationslisten (MyStations), Radio-browser.info-Anbindung,
  Lesezeichen und Logo-Caching.

  Hinweis: Der AVR muss so konfiguriert sein, dass er YTuner erreicht
  (DNS auf den Umbrel-Server umleiten oder Port 80 erreichbar halten).
releaseNotes: Erste Umbrel-Verpackung von YTuner 1.2.6.
developer: coffeegreg
website: https://github.com/coffeegreg/YTuner
repo: https://github.com/coffeegreg/YTuner
support: https://github.com/coffeegreg/YTuner/issues
gallery:
  - 1.jpg
path: ""
defaultUsername: ""
deterministicPasswords: false
