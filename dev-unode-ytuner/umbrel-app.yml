manifestVersion: 1
id: dev-unode-ytuner
name: YTuner
tagline: Internet-Radio für vTuner-AVRs (Yamaha, Denon, Marantz u. a.)
icon: https://raw.githubusercontent.com/servietos/dev-unode/f00ff166d2f7ec2c28a7345fae3a5bfd2fe0a486/gallery/ytuner_icon.svg
category: media
version: "1.2.6"
port: 8095
description: |-
  YTuner ersetzt den eingestellten vTuner-Internetradio-Dienst für AVRs
  von Yamaha, Denon, Onkyo, Marantz, Pioneer, Harman Kardon u. a.
  Bietet eigene Stationslisten (MyStations), Radio-browser.info-Anbindung,
  Lesezeichen und Logo-Caching.

  Läuft auf Ports 8095 (Web) und 8053 (DNS). Da Port 80/53 auf dem Node
  durch Umbrel/Pi-hole belegt sind, muss am Router eine DNS-Weiterleitung
  für *.vtuner.com auf den Node-Port 8053 bzw. der AVR entsprechend
  konfiguriert werden.
releaseNotes: YTuner 1.2.6 mit Community-Image gpopesc/ytuner.
developer: coffeegreg (Image: gpopesc)
website: https://github.com/coffeegreg/YTuner
repo: https://github.com/gpopesc/ytuner
support: https://github.com/coffeegreg/YTuner/issues
gallery:
  - 1.jpg
path: ""
defaultUsername: ""
deterministicPasswords: false
