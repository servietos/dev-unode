id: dev-unode-broking
name: Broking
tagline: Aktien, ETFs und Krypto screenen, Thesen führen, im Paper-Depot (EUR) handeln
category: finance
version: "0.3.2"
port: 3847
icon: https://raw.githubusercontent.com/servietos/dev-unode/master/src/broking/web/static/icon.svg
description: >-
  Weboberfläche für das broking-Projekt: lädt Tageskurse (Yahoo Finance) für US-Aktien,
  Xetra-Aktien und -ETFs sowie Krypto, filtert das Universum nach Trend, RSI und Liquidität,
  zeigt Kurs-Charts mit SMA 50/200 und führt ein Journal mit messbaren Thesen samt Trefferquote.


  Handel im simulierten Paper-Depot in EUR mit Core-Satellite: Der Core (Standard MSCI World,
  75 %) ist Bestand und Benchmark, der Satellit (max. 25 %, 3 Positionen) für Swing-Trades.
  Order-Ticket mit Vorschlag aus ATR und Limits, serverseitige Prüfung (Risiko je Trade,
  Positionsgröße, Satellit-Quote, Mindestorder, Gebühren, Tagesverlust, Drawdown), dann
  Bracket-Order mit Stop-Loss und Ziel. Gebühren wie Bitpanda, Bruchstücke erlaubt. Jede
  Order legt automatisch eine These im Journal an.


  Mo–Fr lädt sie zu einstellbaren Uhrzeiten (Standard 07:30 und 22:30) automatisch Kurse,
  rechnet den Screen, wertet fällige Thesen aus und schreibt das Depot fort. Keine
  Broker-Schlüssel nötig, alle Daten bleiben auf dem Umbrel.
