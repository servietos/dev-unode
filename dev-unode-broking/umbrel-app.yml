id: dev-unode-broking
name: Broking
tagline: Aktien screenen, Thesen führen und per Alpaca Paper-Trading handeln
category: finance
version: "0.2.0"
port: 3847
icon: https://raw.githubusercontent.com/servietos/dev-unode/master/src/broking/web/static/icon.svg
description: >-
  Weboberfläche für das broking-Projekt: lädt Tageskurse (Yahoo Finance), filtert das
  Universum nach Trend, RSI und Liquidität, zeigt Kurs-Charts mit SMA 50/200 und führt ein
  Journal mit messbaren Thesen samt Trefferquote.


  Handel über Alpaca (nur Paper-Trading): Order-Ticket mit Vorschlag aus ATR und Limits,
  serverseitige Prüfung gegen das Live-Depot inklusive offener Orders (Positionsgröße, Risiko
  pro Trade, Cash, Tagesverlust, Whitelist, Handelszeiten), Bestätigung, dann Bracket-Order
  mit Stop-Loss und Ziel. Jede Order legt automatisch eine These im Journal an.


  Mo–Fr lädt sie zu einstellbaren Uhrzeiten (Standard 07:30 und 22:30) automatisch Kurse,
  rechnet den Screen, wertet fällige Thesen aus und gleicht das Depot ab. Alpaca-Schlüssel
  trägst du in den Einstellungen ein; sie bleiben auf dem Umbrel.
