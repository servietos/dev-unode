version: "3.8"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-freshrss_server_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: lscr.io/linuxserver/freshrss:1.30.4
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/config
