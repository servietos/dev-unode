name: Broking-Image bauen

# Baut src/broking als Multi-Arch-Image (amd64 + arm64) nach ghcr.io/<owner>/broking.
# Image-Tag = Inhalt von src/broking/VERSION; auf master zusätzlich "latest".
# Neue Version: VERSION erhöhen und den Tag in dev-unode-broking/docker-compose.yml
# sowie version in dev-unode-broking/umbrel-app.yml anpassen.
on:
  push:
    paths:
      - "src/broking/**"
      - ".github/workflows/broking-image.yml"
  pull_request:
    paths:
      - "src/broking/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: src/broking

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r web/requirements.txt httpx
      - run: python -m unittest discover -s tests -t . -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/broking
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: src/broking
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
