manifestVersion: 1
id: dev-unode-smart-tv-telegram
name: Smart TV Telegram
tagline: Videos aus Telegram per Bot auf Smart-TV, Chromecast oder Kodi abspielen
category: media
version: "1.4.0-1.1"
port: 8351
icon: https://raw.githubusercontent.com/servietos/dev-unode/master/gallery/smart-tv-telegram-icon.svg
description: >-
  Ein Telegram-Bot, der Videos und Filme aus Telegram ohne Download direkt auf deinen
  Fernseher streamt: UPnP/DLNA-Smart-TVs, Chromecast, Kodi oder VLC im Heimnetz.


  Einrichtung über die App-Seite im Umbrel: API-ID und API-Hash (my.telegram.org), Bot-Token
  (@BotFather) und deine Telegram-ID eintragen und speichern. Die IP des Umbrel wird automatisch
  vorgeschlagen. Danach dem Bot ein Video schicken und ein Gerät auswählen.


  Der Bot läuft im Host-Netz auf Port 8350, damit er Fernseher im Heimnetz findet. Die eigene
  Weboberfläche des Bots kann optional mit Passwort eingeschaltet werden.
developer: andrew-ld
website: https://github.com/andrew-ld/smart-tv-telegram
repo: https://github.com/andrew-ld/smart-tv-telegram
support: https://github.com/andrew-ld/smart-tv-telegram/issues
submitter: servietos
