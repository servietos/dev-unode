description: >-
  Open-source Coding-Agent als Web-Terminal. Unterstützt OpenAI-kompatible
  APIs, Gemini, GitHub Models, Codex, Ollama und weitere Provider.


  Nicht offiziell von Umbrel oder den unterstützten Modellanbietern.
  OpenClaude kann Shell-Befehle ausführen und auf Dateien im Workspace
  zugreifen. Nicht ins öffentliche Internet exponieren.


  Beim ersten Start wird OpenClaude installiert. Provider/API-Zugangsdaten
  richtest du anschließend im Terminal mit /provider ein.
