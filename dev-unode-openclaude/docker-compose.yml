version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-openclaude_web_1
      APP_PORT: 7682

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    init: true
    stop_grace_period: 30s
    working_dir: /data/workspace
    environment:
      HOME: /data
      NPM_CONFIG_PREFIX: /data/npm
      PATH: /data/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${APP_DATA_DIR}/data:/data
    configs:
      - source: entrypoint_sh
        target: /entrypoint.sh
        mode: 0444
    entrypoint: ["/bin/bash", "/entrypoint.sh"]


# Startskript liegt als configs-Inhalt hier, damit App-Updates es mitbringen (Quelle: entrypoint.sh).
configs:
  # BEGIN embedded entrypoint_sh (entrypoint.sh)
  # Nicht hier bearbeiten: Quelle ist entrypoint.sh, danach `python tools/embed.py`.
  entrypoint_sh:
    content: |
      #!/bin/bash
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      export HOME=/data
      export NPM_CONFIG_PREFIX=/data/npm
      export PATH="/data/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      mkdir -p /data/workspace /data/npm /data/bin

      MARKER=/data/.openclaude-bootstrap-ok
      if [ ! -f "$$MARKER" ] || [ ! -x /data/bin/ttyd ] || [ ! -x /data/npm/bin/openclaude ]; then
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git ripgrep
        rm -rf /var/lib/apt/lists/*

        ARCH="$$(uname -m)"
        case "$$ARCH" in
          x86_64|amd64) TTYD_ASSET="ttyd.x86_64" ;;
          aarch64|arm64) TTYD_ASSET="ttyd.aarch64" ;;
          *) echo "Unsupported architecture: $$ARCH" >&2; exit 1 ;;
        esac

        curl -fsSL "https://github.com/tsl0922/ttyd/releases/download/1.7.7/$${TTYD_ASSET}" -o /data/bin/ttyd
        chmod +x /data/bin/ttyd
        npm install -g @twigpine/openclaude@latest
        touch "$$MARKER"
      fi

      cd /data/workspace
      exec /data/bin/ttyd --writable -p 7682 --interface 0.0.0.0 /data/npm/bin/openclaude
  # END embedded entrypoint_sh
