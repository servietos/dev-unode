version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-goldcoin-core_web_1
      APP_PORT: 3000

  node:
    image: debian:bookworm-slim
    container_name: dev-unode-goldcoin-core_node_1
    restart: unless-stopped
    stop_grace_period: 2m
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      mkdir -p /data/bin /data/.goldcoin
      if [ ! -x /data/bin/goldcoind ]; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl tar
        rm -rf /var/lib/apt/lists/*
        case "$$(uname -m)" in
          x86_64) ARCH=x86_64 ;;
          aarch64|arm64) ARCH=aarch64 ;;
          *) echo "Unsupported architecture: $$(uname -m)" >&2; exit 1 ;;
        esac
        VERSION="$${GOLDCOIN_VERSION}"
        curl -fL "https://github.com/goldcoin/goldcoin/releases/download/v$${VERSION}/goldcoin-$${VERSION}-$${ARCH}-linux-gnu.tar.gz" -o /tmp/goldcoin.tar.gz
        tar -xzf /tmp/goldcoin.tar.gz -C /tmp
        cp "/tmp/goldcoin-$${VERSION}/bin/goldcoind" "/tmp/goldcoin-$${VERSION}/bin/goldcoin-cli" /data/bin/
        chmod 755 /data/bin/goldcoind /data/bin/goldcoin-cli
      fi
      printf 'server=1\ndaemon=0\nlisten=1\nport=8333\nrpcport=8332\nrpcbind=0.0.0.0\nrpcallowip=172.16.0.0/12\nrpcuser=%s\nrpcpassword=%s\n' "$${RPC_USER}" "$${RPC_PASSWORD}" > /data/.goldcoin/goldcoin.conf
      exec /data/bin/goldcoind -datadir=/data/.goldcoin -conf=/data/.goldcoin/goldcoin.conf -printtoconsole
    environment:
      GOLDCOIN_VERSION: "0.15.0"
      RPC_USER: "goldcoin"
      RPC_PASSWORD: "${APP_SEED}"
    volumes:
      - ${APP_DATA_DIR}/data:/data


  web:
    image: python:3.13-alpine
    container_name: dev-unode-goldcoin-core_web_1
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "/app/web.py"]
    environment:
      RPC_URL: http://dev-unode-goldcoin-core_node_1:8332
      RPC_USER: "goldcoin"
      RPC_PASSWORD: "${APP_SEED}"
      PORT: "3000"
    configs:
      - source: web_py
        target: /app/web.py
        mode: 0444

  node-p2p:
    image: alpine/socat:1.8.0.1
    restart: unless-stopped
    command: ["TCP-LISTEN:8334,fork,reuseaddr", "TCP:dev-unode-goldcoin-core_node_1:8333"]
    ports:
      - "8334:8334"
    depends_on: [node]

# Statusseite liegt als configs-Inhalt hier, damit App-Updates sie mitbringen (Quelle: scripts/web.py).
configs:
  # BEGIN embedded web_py (scripts/web.py)
  # Nicht hier bearbeiten: Quelle ist scripts/web.py, danach `python tools/embed.py`.
  web_py:
    content: |
      #!/usr/bin/env python3
      """Small, read-only Goldcoin JSON-RPC web console."""
      import base64
      import json
      import os
      import urllib.error
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


      RPC_URL = os.environ.get("RPC_URL", "http://127.0.0.1:8332")
      AUTH = "Basic " + base64.b64encode(
          f"{os.environ['RPC_USER']}:{os.environ['RPC_PASSWORD']}".encode()
      ).decode()
      PORT = int(os.environ.get("PORT", "3000"))

      ALLOWED_METHODS = frozenset({
          "getblockchaininfo", "getnetworkinfo", "getpeerinfo", "getmempoolinfo",
          "getmininginfo", "uptime", "getblockcount", "getbestblockhash", "getblock",
          "getblockhash", "getrawmempool", "getdifficulty", "getconnectioncount",
          "getnettotals", "getchaintips",
      })

      PAGE = """<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Goldcoin Core</title>
      <style>body{font:16px system-ui;max-width:860px;margin:3rem auto;padding:0 1rem;background:#10151d;color:#e8edf2}h1{color:#f5c542}input,button{font:inherit;padding:.7rem;margin:.3rem;background:#202a36;color:inherit;border:1px solid #485668;border-radius:5px}button{cursor:pointer}pre{white-space:pre-wrap;background:#1a222d;padding:1rem;border-radius:6px;min-height:8rem}small{color:#9eacba}</style>
      <h1>Goldcoin Core</h1><p>Node status and JSON-RPC console</p><button onclick="rpc('getblockchaininfo')">Blockchain</button><button onclick="rpc('getnetworkinfo')">Network</button><button onclick="rpc('getpeerinfo')">Peers</button><form onsubmit="event.preventDefault();rpc(document.querySelector('#method').value)"><input id="method" value="getblockchaininfo" aria-label="RPC method"><button>Run RPC</button></form><small>RPC-Methoden mit Seiteneffekten wie sendtoaddress nur bewusst aufrufen.</small><pre id="out">Loading status…</pre>
      <script>async function rpc(method){let o=document.querySelector('#out');o.textContent='Loading…';try{let r=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method})});let d=await r.json();o.textContent=JSON.stringify(d,null,2)}catch(e){o.textContent=String(e)}}rpc('getblockchaininfo')</script>"""

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path not in ("/", "/index.html"):
                  self.send_error(404)
                  return
              body = PAGE.encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/html; charset=utf-8")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def do_POST(self):
              if self.path != "/rpc":
                  self.send_error(404)
                  return
              ctype = self.headers.get("Content-Type", "").split(";")[0].strip().lower()
              if ctype != "application/json":
                  self.reply(415, {"error": "Content-Type must be application/json"})
                  return
              try:
                  request = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))))
                  method = request.get("method", "")
                  if not isinstance(method, str) or not method.replace("_", "").isalnum():
                      raise ValueError("Invalid RPC method")
                  if method not in ALLOWED_METHODS:
                      self.reply(403, {"error": "RPC method not allowed: " + method})
                      return
                  payload = json.dumps({"jsonrpc": "1.0", "id": "web", "method": method, "params": request.get("params", [])}).encode()
                  req = urllib.request.Request(RPC_URL, data=payload, headers={"Authorization": AUTH, "Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=10) as response:
                      result = json.loads(response.read())
                  status = 200
              except urllib.error.HTTPError as exc:
                  try:
                      result = json.loads(exc.read())
                  except Exception:
                      result = {"error": str(exc)}
                  status = 502
              except Exception as exc:
                  result = {"error": str(exc)}
                  status = 502
              self.reply(status, result)

          def reply(self, status, result):
              body = json.dumps(result).encode()
              self.send_response(status)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

          def log_message(self, format, *args):
              print("web:", format % args, flush=True)

      ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
  # END embedded web_py
