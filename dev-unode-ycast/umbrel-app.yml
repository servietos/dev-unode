description: >-
  YCast ersetzt den eingestellten vTuner-Dienst, den viele AV-Receiver und Netzwerk-Player
  (ca. 2011–2017, z. B. Marantz, Denon, Yamaha, Onkyo, Pioneer, Grundig) für Internetradio nutzen.
  Der Receiver zeigt deine eigenen Sender unter „My Stations“ und kann den Community Radio
  Browser nach Land, Genre und Sprache durchsuchen. Getestet mit einem Marantz M-CR510.


  Fernbedienung für Denon/Marantz-Netzwerkgeräte: Ein/Standby, Abspielen/Pause, vorheriger und
  nächster Sender, Lautstärke und Stumm, „Zuletzt gespielt“ und ein Ausschalt-Timer. Jeder Sender
  lässt sich per Klick direkt auf dem Gerät starten (UPnP/DLNA). Das Display zeigt Sendername,
  den laufenden Titel aus dem Stream sowie Format und Bitrate. Auf dem Handy bleiben Display und
  Bedienung beim Scrollen oben stehen; auf dem iPhone über „Zum Home-Bildschirm“ als App nutzbar.


  Weboberfläche auf Deutsch und Englisch, hell oder dunkel: Kategorien und Sender verwalten
  (Drag & Drop), im Browser vorhören, Streams testen, Sender im Radio Browser suchen und
  übernehmen, stations.yml importieren/exportieren, Abruf-Log des Receivers, DNS-Prüfung und
  Netzwerk-Einstellung. Für den Radio Browser wählt YCast automatisch einen erreichbaren Server;
  alternativ ein fester oder ein eigener Server (z. B. ein Spiegel im Heimnetz).


  Formate, die Receiver nicht selbst abspielen können, wandelt YCast um: HLS (.m3u8), Ogg/Opus
  und HE-AAC per ffmpeg (AAC/MP3 nur umverpackt, sonst MP3 192 kbit/s); HTTPS-Streams laufen über
  ein internes Relay als HTTP.


  Voraussetzungen und Einrichtung:


  1. Eine freie IP im Heimnetz außerhalb des DHCP-Bereichs deines Routers. Der Receiver-Dienst
  läuft darauf auf Port 80 (eigene LAN-IP per macvlan, weil Port 80 des Umbrel belegt ist).
  Standard ist <dein Netz>.210, z. B. 192.168.178.210. Adapter, Netz und Gateway erkennt die App
  selbst; die IP kannst du unter „Einrichtung → Netzwerk“ ändern (gilt nach Neustart der App).
  Ist die gespeicherte IP ungültig, startet die App mit dem Standard und zeigt einen Hinweis.


  2. Ein DNS-Server, den du selbst pflegen kannst (z. B. Pi-hole, AdGuard Home oder ein Router
  mit eigenen DNS-Einträgen). Dort den vTuner-Namen deines Receivers auf die YCast-IP zeigen
  lassen, bei Pi-hole 6 unter Settings → Local DNS Records. Denon/Marantz: denon.vtuner.com und
  denon2.vtuner.com; Yamaha: radioyamaha.vtuner.com; Onkyo: onkyo.vtuner.com; Grundig:
  grundig.vtuner.com und grundig.radiosetup.com.


  3. Der Receiver muss diesen DNS-Server nutzen. Danach einmal stromlos machen und Internetradio
  öffnen; unter „Einrichtung“ erscheint er dann als „Receiver gesehen“. Für die Fernbedienung
  im Receiver „Netzwerk-Standby“ einschalten.


  Hinweis: Der Umbrel selbst erreicht die YCast-IP nicht (Eigenschaft von macvlan), alle
  anderen Geräte im Netz schon. Kein WLAN-only-Umbrel: macvlan braucht in der Regel einen
  kabelgebundenen Netzwerkadapter.


  English: YCast replaces the discontinued vTuner internet radio service used by many AV receivers
  (Marantz, Denon, Yamaha, Onkyo …). Manage your own stations, search the Community Radio Browser
  and remote-control Denon/Marantz devices (play/pause, next/previous station, volume, sleep
  timer, now-playing display with bitrate). The web interface is available in German and English.
  Setup needs a free LAN IP for the receiver service (port 80) and a DNS entry (e.g. in Pi-hole)
  pointing the receiver's vTuner hostname to that IP.
