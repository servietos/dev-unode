manifestVersion: 1
id: dev-unode-ycast
name: YCast
tagline: Internetradio für Marantz, Denon & Co. ohne vTuner
category: media
version: "2.0.0"
port: 3848
icon: https://raw.githubusercontent.com/servietos/dev-unode/master/src/ycast/ycastui/static/icon.svg
description: >-
  YCast ersetzt den eingestellten vTuner-Dienst, den viele AV-Receiver und Netzwerk-Player
  (z. B. Marantz M-CR510, Denon) für Internetradio nutzen. Der Receiver findet deine Sender
  unter „My Stations“ und kann zusätzlich den Community Radio Browser durchsuchen.


  Die Weboberfläche verwaltet alles: Kategorien und Sender anlegen, sortieren (Drag & Drop),
  im Browser vorhören, Streams testen, Sender aus dem Radio Browser suchen und übernehmen,
  Import/Export der stations.yml. Unter „Status & Einrichtung“ siehst du, wann dein Receiver
  zuletzt angefragt hat, und kannst die DNS-Umleitung deiner Pi-holes prüfen.


  HTTPS-Streams, die der Receiver selbst nicht abspielen kann, leitet YCast automatisch über
  ein internes Relay als HTTP weiter.


  Einrichtung: Der Receiver-Dienst bekommt eine eigene LAN-IP (Standard 192.168.178.210, Port 80).
  Im Pi-hole 6 unter misc.dnsmasq_lines die Zeile address=/vtuner.com/192.168.178.210 eintragen.
developer: servietos
website: https://github.com/servietos/dev-unode/tree/master/src/ycast
repo: https://github.com/servietos/dev-unode/tree/master/src/ycast
