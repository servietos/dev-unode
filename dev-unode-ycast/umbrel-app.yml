releaseNotes: >-
  Die Sprachauswahl (Deutsch/Englisch) ist von der Kopfzeile in die Einrichtung umgezogen.
  In der Senderdatenbank lassen sich jetzt eigene Radio-Browser-Server hinzufügen, z. B. ein
  selbst betriebener Spiegel im Heimnetz. YCast prüft die Adresse beim Hinzufügen; eigene Server
  lassen sich fest auswählen und werden bei „Automatisch“ zuerst gefragt.
