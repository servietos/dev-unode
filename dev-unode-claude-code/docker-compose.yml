version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dev-unode-claude-code_web_1
      APP_PORT: 7681

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    init: true
    stop_grace_period: 30s
    working_dir: /data/workspace
    environment:
      HOME: /data
      NPM_CONFIG_PREFIX: /data/npm
      PATH: /data/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
